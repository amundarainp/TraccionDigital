<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="theme-color" content="#0b0f16" />
  <title>Tracción Digital · Favicon claro</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0f16;color:#f6f7fb;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{width:min(860px,calc(100% - 32px));padding:44px;border:1px solid rgba(216,181,107,.22);border-radius:28px;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.025));box-shadow:0 24px 70px rgba(0,0,0,.38)}.eyebrow{color:#f1ce88;font-size:.8rem;font-weight:850;letter-spacing:.12em;text-transform:uppercase}h1{font-size:clamp(2rem,5vw,4rem);line-height:.96;letter-spacing:-.05em;margin:14px 0 16px}.copy{color:#aeb7c5;max-width:58ch}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:30px}.item{min-height:150px;border:1px solid rgba(255,255,255,.08);border-radius:18px;background:#fff;display:grid;place-items:center;color:#111;padding:18px}.item.dark{background:#080c12;color:#fff}.item img{image-rendering:auto}.label{font-size:.78rem;font-weight:800;margin-top:10px;text-align:center}@media(max-width:680px){.wrap{padding:28px 20px}.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="eyebrow">Auditoría visual · favicon</div>
    <h1>Versión clara seleccionada</h1>
    <p class="copy">Esta página usa en la pestaña el nuevo favicon claro. La prueba importante es cómo se reconoce arriba, a tamaño real de navegador, tanto con pestaña clara como oscura.</p>
    <div class="grid">
      <div><div class="item"><img src="/favicon-16x16.png" width="16" height="16" alt="Favicon 16x16"></div><div class="label">16 × 16</div></div>
      <div><div class="item dark"><img src="/favicon-32x32.png" width="32" height="32" alt="Favicon 32x32"></div><div class="label">32 × 32 · fondo oscuro</div></div>
      <div><div class="item"><img src="/favicon-48x48.png" width="48" height="48" alt="Favicon 48x48"></div><div class="label">48 × 48</div></div>
    </div>
  </main>
</body>
</html>
